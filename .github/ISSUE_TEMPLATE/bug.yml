name: Bug report
description: Something in webapp-anything itself is broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran (add WAA_DEBUG=1 for stack traces).
      render: shell
  - type: input
    id: version
    attributes:
      label: Version (`waa --version`) and Node.js version
