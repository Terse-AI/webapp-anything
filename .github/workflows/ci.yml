name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: CLI smoke test
        shell: bash
        run: |
          node dist/cli.js --version
          node dist/cli.js backends
          for f in examples/hello-dos/HELLO.COM examples/hello-win32/hello.exe examples/hello-java/hello.jar \
                   examples/hello-flash/hello.swf examples/hello-floppy/hello.img examples/hello-linux/hello examples/hello-web; do
            node dist/cli.js scan "$f" --json > /dev/null
          done
          node dist/cli.js build examples/hello-web --out out/web
          test -f out/web/waa.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: webapp-anything:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Server starts and answers /healthz
        run: |
          docker run -d --name waa -p 8080:8080 -e WAA_TOKEN=ci-token-0123456789abcdef webapp-anything:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs waa
          exit 1
