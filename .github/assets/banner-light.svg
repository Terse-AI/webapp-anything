<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
<title id="t">webapp-anything</title>
<desc id="d">Turn desktop software into web apps: DOS, Windows, Flash, Java, Linux and disk images running in a browser window.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f8fc"/><stop offset="1" stop-color="#e9eefb"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#3d63dd"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7aa2ff" stop-opacity="0.45"/><stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b2a4a" stroke-opacity="0.06"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.18"/></filter>
  <clipPath id="screen"><rect x="716" y="98" width="500" height="286" rx="0"/></clipPath>
  <clipPath id="pill"><rect x="64" y="200" width="352" height="44" rx="10"/></clipPath>
  <clipPath id="window"><rect x="716" y="58" width="500" height="326" rx="14"/></clipPath>
</defs>
<style>
  .scene { opacity: 0; animation: scene 15s infinite both; }
  .scene[data-first] { opacity: 1; }
  @keyframes scene { 0% { opacity: 0 } 1.6% { opacity: 1 } 15% { opacity: 1 } 16.6% { opacity: 0 } 100% { opacity: 0 } }
  .chip-on { opacity: 0; animation: chip 15s infinite both; animation-delay: inherit; }
  .chip-on[data-first] { opacity: 1; }
  .chip { animation: lift 15s infinite both; }
  @keyframes chip { 0% { opacity: 0 } 1.6% { opacity: 1 } 15% { opacity: 1 } 16.6% { opacity: 0 } 100% { opacity: 0 } }
  @keyframes lift { 0% { transform: translateY(0) } 1.6% { transform: translateY(-3px) } 15% { transform: translateY(-3px) } 16.6% { transform: translateY(0) } 100% { transform: translateY(0) } }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  .spin { animation: spin 6s linear infinite; }
  .spin-rev { animation: spin 4s linear infinite reverse; }
  .orbit { animation: spin 7s linear infinite; }
  .orbit2 { animation: spin 5s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .pointer { animation: press 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes press { 0%, 60%, 100% { transform: translate(0, 0) } 70% { transform: translate(-2px, -2px) } }
  .typing { transform: translateX(304.2px); animation: type 15s steps(36) infinite; }
  @keyframes type { 0% { transform: translateX(0) } 18% { transform: translateX(304.2px) } 100% { transform: translateX(304.2px) } }
  .flow { stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -32 } }
  .float { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; }
    .scene[data-first], .chip-on[data-first] { opacity: 1; }
  }
</style>
<rect width="1280" height="420" fill="url(#bg)"/>
<rect width="1280" height="420" fill="url(#grid)"/>
<ellipse cx="966" cy="241" rx="420" ry="230" fill="url(#glow)"/>

<text x="64" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#title)">webapp-anything</text>
<text x="66" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#4b5568">Any desktop program → a link that runs in the browser.</text>

